
name: Build EggFishingAuto APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          unzip EggFishingAutoApp-Source.zip -d source

      - name: Build APK
        run: |
          cd source/EggFishingAutoApp
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EggFishingAuto-APK
          path: source/EggFishingAutoApp/app/build/outputs/apk/debug/*.apk
concurrency: 
